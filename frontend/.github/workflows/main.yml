name: CI Deployment
on:
  push:
    branches:
      - 'main'
      - 'dev'

jobs:

  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}


    - name: Copy .env.prod to .env
      if: github.ref == 'refs/heads/main'
      run: |
        cp .env.prod .env

    - name: Copy .env.staging to .env
      if: github.ref == 'refs/heads/dev'
      run: |
        cp .env.staging .env

 
    - name: Production Deploy
      if: github.ref == 'refs/heads/main'
      run: |
        docker build -t chicinfra/chic:frontend-prod .
        docker push chicinfra/chic:frontend-prod
 
    - name: Staging Deploy
      if: github.ref == 'refs/heads/dev'
      run: |
        docker build -t chicinfra/chic:frontend-staging .
        docker push chicinfra/chic:frontend-staging
 