upstream chic_strapi {
	server localhost:1337;
}

server {
	server_name strapi.chic.ngo;

	client_max_body_size 100M;

	# Only the website's content API, uploaded files and the health check are public.
	# Content is edited at chic.ngo/admin; the built-in Strapi admin is SSH-tunnel only.
	location ~ ^/(api/|uploads/|_health$) {
		proxy_pass http://chic_strapi;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		proxy_cache_bypass $http_upgrade;
	}

	location / {
		return 404;
	}
}
